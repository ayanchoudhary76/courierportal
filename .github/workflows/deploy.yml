name: Deploy CourierPortal to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_mysql, bcmath, xml, tokenizer, ctype, openssl, zip, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /var/www/courierportal

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🎨 Building frontend assets..."
            npm ci && npm run build

            echo "🗄️  Running migrations..."
            php artisan migrate --force

            echo "⚡ Caching config, routes, views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔄 Restarting queue worker..."
            php artisan queue:restart

            echo "🔁 Reloading PHP-FPM and Nginx..."
            sudo systemctl reload php8.3-fpm
            sudo systemctl reload nginx

            echo "✅ Deployment complete at $(date)"
