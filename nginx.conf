server {
    listen 80;
    server_name yourcourierdomain.com www.yourcourierdomain.com;
    root /var/www/courierportal/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-XSS-Protection "1; mode=block";

    # Laravel catch-all
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static asset caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block hidden files (except Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 10M;
    keepalive_timeout 65;

    error_log  /var/log/nginx/courierportal_error.log;
    access_log /var/log/nginx/courierportal_access.log;
}

